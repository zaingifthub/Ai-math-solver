# /etc/nginx/sites-available/ai-math-solver
# Replace example.com with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/ai-math-solver /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com

limit_req_zone $binary_remote_addr zone=ams_api:10m rate=20r/s;

upstream ai_math_solver {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 6m;   # photo uploads (app limit is 5 MB)

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Long-lived caching for hashed build assets
    location /_next/static/ {
        proxy_pass http://ai_math_solver;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/ {
        limit_req zone=ams_api burst=40 nodelay;
        proxy_pass http://ai_math_solver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Streaming AI tutor responses (Server-Sent Events)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://ai_math_solver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
